name: Docker

# Pull requests that touch the image only check that it builds. A version tag (v1.2.3)
# builds the image for amd64 and arm64 and publishes it to ghcr.io/<owner>/calendar-sync.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - composer.json
      - composer.lock
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate both Compose files
        working-directory: docker
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-check/' .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.sqlite.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet

  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # A broken image is never published: the web role must migrate a fresh SQLite database,
      # generate the APP_KEY and answer on /up before the multi-arch build is pushed.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: calendar-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name calsync -p 8080:8080 \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/app/storage/app/database.sqlite \
            -e APP_URL=http://localhost:8080 calendar-sync:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/up > /dev/null && exit 0
            sleep 2
          done
          docker logs calsync
          exit 1

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=calendar-sync
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build, and push on tags
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
