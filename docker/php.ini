; PHP settings for the calendar-sync image (on top of php.ini-production).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 8M

; The code never changes inside a container: no need to check file timestamps.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
