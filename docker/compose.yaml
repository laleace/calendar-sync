# calendar-sync with MySQL.
#   cp .env.example .env    # then set DB_PASSWORD and APP_URL
#   docker compose up -d
#   docker compose exec web php artisan calsync:create-admin
# SQLite variant, without the database container: compose.sqlite.yaml.

name: calendar-sync

x-app: &app
  image: ghcr.io/laleace/calendar-sync:${CALSYNC_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: calendar_sync
    DB_USERNAME: calendar_sync
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  volumes:
    - data:/app/storage/app
  security_opt:
    - no-new-privileges:true

x-services-healthcheck: &services-healthcheck
  # Fails when the scheduler or the queue worker stop: no sync would run.
  test: ["CMD", "php", "artisan", "calsync:doctor", "--services", "--no-ansi"]
  interval: 60s
  timeout: 20s
  start_period: 3m
  retries: 2

services:
  web:
    <<: *app
    command: web
    ports:
      # Reachable from your network. Behind a reverse proxy on the same machine:
      # "127.0.0.1:8080:8080".
      - ${CALSYNC_HTTP_PORT:-8080}:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 1m

  worker:
    <<: *app
    command: worker
    # A running sync gets time to finish before the container stops.
    stop_grace_period: 1m
    depends_on:
      web:
        condition: service_healthy
    healthcheck: *services-healthcheck

  scheduler:
    <<: *app
    command: scheduler
    depends_on:
      web:
        condition: service_healthy
    healthcheck: *services-healthcheck

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: calendar_sync
      MYSQL_USER: calendar_sync
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # The server listens on TCP only once the first-start initialisation is over.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u calendar_sync -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 1m
      retries: 10

volumes:
  data:
  mysql:
