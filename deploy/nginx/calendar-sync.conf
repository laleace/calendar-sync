# /etc/nginx/sites-available/calendar-sync
# Replace calsync.example.com with your hostname.
# Debian 12 ships nginx 1.22: HTTP/2 is enabled on the listen line ("http2 on;" needs 1.25+).

server {
    listen 80;
    listen [::]:80;
    server_name calsync.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calsync.example.com;

    ssl_certificate     /etc/letsencrypt/live/calsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calsync.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/calendar-sync/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # LAN only: private networks and the machine itself (a future Cloudflare Tunnel
    # connects from 127.0.0.1). Adjust to your subnets.
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Filament assets are versioned (?v=...): cache them.
    location ~* ^/(css|js|fonts)/filament/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/calendar-sync.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
        internal;
    }

    # Any other PHP file, and dotfiles (.env, .git), are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
