; /etc/php/8.4/fpm/pool.d/calendar-sync.conf
; Dedicated pool: PHP runs as the "calsync" user, nginx talks to it through a socket.

[calendar-sync]
user = calsync
group = calsync

listen = /run/php/calendar-sync.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Single-user admin panel: a few on-demand workers are plenty.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

security.limit_extensions = .php

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 8M
php_admin_flag[log_errors] = on
; Written by the pool workers (user calsync): must be inside the writable storage directory.
php_admin_value[error_log] = /var/www/calendar-sync/storage/logs/php-fpm.log
