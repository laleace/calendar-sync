; /etc/php/8.4/fpm/conf.d/99-calendar-sync.ini
expose_php = Off

; OPcache: code changes are picked up by "systemctl reload php8.4-fpm" (done by update.sh).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
